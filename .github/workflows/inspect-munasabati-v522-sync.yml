name: Inspect Munasabati v5.2.2 Sync UI

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/inspect-munasabati-v522-sync.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact v5.2.1 source and print sync UI
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-v502-brand/source.part*.b64 > /tmp/v502.b64
          base64 --decode /tmp/v502.b64 > /tmp/v502.tgz
          mkdir -p v5src
          tar -xzf /tmp/v502.tgz -C v5src
          python .munasabati-v5.0.3-final/apply_userfix503.py v5src
          base64 --decode .munasabati-v5.0.4/v504.patch.gz.b64 | gunzip > /tmp/v504.patch
          patch -p1 -d v5src < /tmp/v504.patch >/dev/null
          cat .munasabati-v5.1.0/parts/part* > /tmp/v510.patch.gz.b64
          base64 --decode /tmp/v510.patch.gz.b64 | gunzip > /tmp/v510.patch
          patch -p1 -d v5src < /tmp/v510.patch >/dev/null
          python .munasabati-v5.2.0/apply_v520.py v5src .munasabati-v5.2.0
          python .munasabati-v5.2.1/apply_v521.py v5src
          echo '=== MATCHES ==='
          grep -R -n -E 'CalendarSync|calendar sync|مزامنة|syncCalendar|calendarId' v5src/app/src/main/java/com/rafat/munasabati | head -120 || true
          echo '=== SYNC FILES ==='
          grep -R -l -E 'CalendarSync|مزامنة' v5src/app/src/main/java/com/rafat/munasabati | while read f; do echo "--- $f ---"; sed -n '1,320p' "$f"; done
