name: Munasabati v5 isolated build

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.munasabati-v5/**'
      - '.munasabati-v5-beta2/**'
      - '.github/workflows/munasabati-v5-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-beta:
    name: Build, test and launch Munasabati v5 Beta 3
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Restore and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5/source.part*.b64 > /tmp/munasabati-v5.b64
          base64 --decode /tmp/munasabati-v5.b64 > /tmp/Munasabati-v5-source.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/Munasabati-v5-source.zip" | sha256sum -c -
          mkdir -p v5src
          unzip -q /tmp/Munasabati-v5-source.zip -d v5src

      - name: Pin AndroidX to API 36 compatible line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v5src/app/build.gradle.kts')
          s = p.read_text()
          repl = {
            'androidx.compose:compose-bom:2026.08.00':'androidx.compose:compose-bom:2026.06.01',
            'androidx.core:core-ktx:1.19.0':'androidx.core:core-ktx:1.17.0',
            'androidx.activity:activity-compose:1.13.0':'androidx.activity:activity-compose:1.11.0',
            'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0':'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0',
            'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0':'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0',
            'androidx.work:work-runtime:2.11.2':'androidx.work:work-runtime:2.10.5',
          }
          for old,new in repl.items(): s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Apply Kotlin 2.4 strict-type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v5src/app/src/main/java/com/rafat/munasabati/data/MunasabatiDatabase.kt')
          s=p.read_text().replace('arrayOf(System.currentTimeMillis(), personId))','arrayOf<Any?>(System.currentTimeMillis(), personId))')
          p.write_text(s)
          PY

      - name: Apply RTL and v4 retention overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/v5-beta2-overlay.b64
          base64 --decode /tmp/v5-beta2-overlay.b64 > /tmp/v5-beta2-overlay.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/v5-beta2-overlay.tgz" | sha256sum -c -
          tar -xzf /tmp/v5-beta2-overlay.tgz -C v5src
          grep -q 'LayoutDirection.Rtl' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q 'exact_v4_event_mapping' v5src/app/src/main/java/com/rafat/munasabati/migration/LegacyV4Migration.kt

      - name: Make Beta 3 a clean stable package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v5src/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('versionCode = 52','versionCode = 53')
          s=s.replace('versionNameSuffix = "-beta.2"','versionNameSuffix = "-beta.3"')
          s=s.replace('applicationIdSuffix = ".debug"','applicationIdSuffix = ""')
          p.write_text(s)
          b=Path('v5src/app/src/beta/res/values/strings.xml')
          b.parent.mkdir(parents=True, exist_ok=True)
          b.write_text('<resources>\n    <string name="app_name">مناسباتي Beta 3</string>\n</resources>\n')
          PY
          grep -q 'versionCode = 53' v5src/app/build.gradle.kts
          grep -q 'versionNameSuffix = "-beta.3"' v5src/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ""' v5src/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run v5 unit tests
        working-directory: v5src
        run: gradle :app:testBetaDebugUnitTest --stacktrace --no-daemon

      - name: Build v5 Beta APK
        working-directory: v5src
        run: gradle :app:assembleBetaDebug --stacktrace --no-daemon

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch smoke test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            adb logcat -c
            adb install -r v5src/app/build/outputs/apk/beta/debug/*.apk
            adb shell pm grant com.rafat.munasabati.beta android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.rafat.munasabati.beta/com.rafat.munasabati.MainActivity
            sleep 5
            adb shell pidof com.rafat.munasabati.beta
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.rafat.munasabati.beta'
            if adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|Process: com.rafat.munasabati.beta'; then
              echo 'Fatal exception detected during Beta 3 launch'
              exit 1
            fi

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5-beta3-clean-smoke-tested
          path: v5src/app/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error
          retention-days: 14
