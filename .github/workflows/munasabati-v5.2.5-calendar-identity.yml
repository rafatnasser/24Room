name: Munasabati v5.2.5 Calendar Identity

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5.2.5-calendar-identity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v5.2.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-v502-brand/source.part*.b64 > /tmp/v502.b64
          base64 --decode /tmp/v502.b64 > /tmp/v502.tgz
          mkdir -p v5src
          tar -xzf /tmp/v502.tgz -C v5src
          python .munasabati-v5.0.3-final/apply_userfix503.py v5src
          base64 --decode .munasabati-v5.0.4/v504.patch.gz.b64 | gunzip > /tmp/v504.patch
          patch -p1 -d v5src < /tmp/v504.patch
          cat .munasabati-v5.1.0/parts/part* > /tmp/v510.patch.gz.b64
          base64 --decode /tmp/v510.patch.gz.b64 | gunzip > /tmp/v510.patch
          patch -p1 -d v5src < /tmp/v510.patch
          python .munasabati-v5.2.0/apply_v520.py v5src .munasabati-v5.2.0
          python .munasabati-v5.2.1/apply_v521.py v5src
          python .munasabati-v5.2.2/apply_v522.py v5src .munasabati-v5.2.2
          python .munasabati-v5.2.3/apply_v523.py v5src .munasabati-v5.2.3
          python .munasabati-v5.2.4/apply_v524.py v5src .munasabati-v5.2.4
          grep -q 'versionCode = 84' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.2.4"' v5src/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }

      - name: Build v5.2.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:assembleStableRelease --stacktrace --no-daemon
          cp "$(find v5src/app/build/outputs/apk/stable/release -type f -name '*.apk' | head -1)" /tmp/v524-unsigned.apk

      - name: Apply v5.2.5 fixes
        shell: bash
        run: |
          set -euo pipefail
          python .munasabati-v5.2.5/apply_v525.py v5src .munasabati-v5.2.5
          grep -q 'versionCode = 85' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.2.5"' v5src/app/build.gradle.kts
          grep -q 'munasabati_calendar_import_registry_v1' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'likelyLegacyCalendarMatch' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'trackedImportedIds' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'clearTrackedCalendar' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'delay((nextExpiry - nowMillis)' v5src/app/src/main/java/com/rafat/munasabati/ui/V52Experience.kt

      - name: Unit tests and v5.2.5 builds
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:testStableDebugUnitTest --stacktrace --no-daemon
          gradle -p v5src :app:assembleStableDebug :app:assembleStableRelease :app:assembleStableDebugAndroidTest --stacktrace --no-daemon
          cp "$(find v5src/app/build/outputs/apk/stable/release -type f -name '*.apk' | head -1)" /tmp/v525-unsigned.apk

      - name: Sign upgrade pair with one test certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati 525 Test,O=Munasabati,C=SA"
          for v in 524 525; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "/tmp/v${v}-unsigned.apk" "/tmp/v${v}-aligned.apk"
            java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out "/tmp/v${v}.apk" "/tmp/v${v}-aligned.apk"
            java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose "/tmp/v${v}.apk"
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 tests and data-preserving upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            gradle -p v5src :app:connectedStableDebugAndroidTest --stacktrace --no-daemon
            adb uninstall com.rafat.munasabati || true
            adb install /tmp/v524.apk
            adb root || true
            adb wait-for-device
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 10
            adb shell mkdir -p /data/user/0/com.rafat.munasabati/files
            adb shell 'echo keep-v525 > /data/user/0/com.rafat.munasabati/files/v525-upgrade-sentinel.txt'
            adb logcat -c || true
            adb install -r /tmp/v525.apk
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.rafat.munasabati
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 14
            adb shell pidof com.rafat.munasabati
            adb shell cat /data/user/0/com.rafat.munasabati/files/v525-upgrade-sentinel.txt | grep -q keep-v525
            adb shell dumpsys package com.rafat.munasabati | grep -q 'versionCode=85'
            adb logcat -d > /tmp/v525.log 2>/tmp/v525-logcat.err || true
            test -z "$(grep -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/v525.log || true)"
            echo V525_ANDROID_UPGRADE_PASS

      - name: Package validated release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp /tmp/v525-unsigned.apk final/Munasabati-v5.2.5-FINAL-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/zipalign
          sha256sum final/Munasabati-v5.2.5-FINAL-unsigned.apk > final/unsigned-sha256.txt
          printf 'version=5.2.5\nversionCode=85\npersistent-import-identity=PASS\ntolerant-legacy-calendar-cleanup=PASS\ndisconnect-removes-tracked-imports=PASS\nexpired-import-auto-refresh=PASS\nlocal-history-preserved=PASS\nunit-tests=PASS\nandroid-tests=PASS\nupgrade-5.2.4-to-5.2.5=PASS\n' > final/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.2.5-final-upgrade-passed
          path: final/*
          if-no-files-found: error
          retention-days: 7
