name: Build Munasabati APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: MunasabatiLite
        run: gradle assembleRelease --stacktrace
      - name: Collect unsigned APK
        run: cp MunasabatiLite/app/build/outputs/apk/release/app-release-unsigned.apk Munasabati-Unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-Unsigned-APK
          path: Munasabati-Unsigned.apk
          if-no-files-found: error
