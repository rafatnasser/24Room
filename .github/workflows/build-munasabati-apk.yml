name: Build Munasabati APK

on:
  push:
    branches:
      - chatgpt-munasabati-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: MunasabatiLite
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp MunasabatiLite/app/build/outputs/apk/debug/app-debug.apk Munasabati.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-APK
          path: Munasabati.apk
          if-no-files-found: error
