name: Munasabati v5.4 Final Build

on:
  push:
    branches: [ "munasabati-v5.4-build" ]
    paths:
      - '.munasabati-v5.4/**'
      - '.github/workflows/munasabati-v5.4-final-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated v5.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-v502-brand/source.part*.b64 > /tmp/v502.b64
          base64 --decode /tmp/v502.b64 > /tmp/v502.tgz
          mkdir -p v5src
          tar -xzf /tmp/v502.tgz -C v5src
          python .munasabati-v5.0.3-final/apply_userfix503.py v5src
          base64 --decode .munasabati-v5.0.4/v504.patch.gz.b64 | gunzip > /tmp/v504.patch
          patch -p1 -d v5src < /tmp/v504.patch
          cat .munasabati-v5.1.0/parts/part* > /tmp/v510.patch.gz.b64
          base64 --decode /tmp/v510.patch.gz.b64 | gunzip > /tmp/v510.patch
          patch -p1 -d v5src < /tmp/v510.patch
          python .munasabati-v5.2.0/apply_v520.py v5src .munasabati-v5.2.0
          python .munasabati-v5.2.1/apply_v521.py v5src
          python .munasabati-v5.2.2/apply_v522.py v5src .munasabati-v5.2.2
          python .munasabati-v5.2.3/apply_v523.py v5src .munasabati-v5.2.3
          python .munasabati-v5.2.4/apply_v524.py v5src .munasabati-v5.2.4
          python .munasabati-v5.2.5/apply_v525.py v5src .munasabati-v5.2.5
          python .munasabati-v5.2.6/apply_v526.py v5src .munasabati-v5.2.6
          python .munasabati-v5.3.0/apply_v530.py v5src .munasabati-v5.3.0
          grep -q 'versionCode = 90' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.3.0"' v5src/app/build.gradle.kts

      - name: Apply v5.4.0 improvements
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .munasabati-v5.4/v540.patch.gz.b64 | gunzip > /tmp/v540.patch
          patch -p1 -d v5src < /tmp/v540.patch
          grep -q 'versionCode = 100' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.4.0"' v5src/app/build.gradle.kts
          grep -q 'resetDismissedExternalEvents' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'dismissExternalEvent' v5src/app/src/main/java/com/rafat/munasabati/compat/CalendarSync.kt
          grep -q 'CHANNEL_REMINDER_V54' v5src/app/src/main/java/com/rafat/munasabati/reminder/ReminderEngine.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:testStableDebugUnitTest --stacktrace --no-daemon

      - name: Build release and androidTest APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:assembleStableDebug :app:assembleStableRelease :app:assembleStableDebugAndroidTest --stacktrace --no-daemon
          mkdir -p final
          cp "$(find v5src/app/build/outputs/apk/stable/release -type f -name '*.apk' | head -1)" final/Munasabati-v5.4.0-FINAL-unsigned.apk
          cp "$(find v5src/app/build/outputs/apk/stable/debug -type f -name '*.apk' | head -1)" final/Munasabati-v5.4.0-debug.apk
          sha256sum final/*.apk > final/sha256.txt
          printf 'version=5.4.0\nversionCode=100\npackage=com.rafat.munasabati\nunit-tests=PASS\nbuild=PASS\n' > final/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.4.0-final-build
          path: final/*
          if-no-files-found: error
          retention-days: 7
