name: Munasabati v5.0.2 Final Restore Features

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5.0.2-restore-features.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-v502:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oldsrc
          cat .munasabati-v5/source.part*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d oldsrc
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/beta2.b64
          base64 --decode /tmp/beta2.b64 > /tmp/beta2.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/beta2.tgz" | sha256sum -c -
          tar -xzf /tmp/beta2.tgz -C oldsrc
          cat .munasabati-v5-stable/overlay.part*.b64 > /tmp/stable.b64
          base64 --decode /tmp/stable.b64 > /tmp/stable.tgz
          echo "995d93371091cb4cbce75d439d601b906899d39bafca1e04af29287138a64419  /tmp/stable.tgz" | sha256sum -c -
          tar -xzf /tmp/stable.tgz -C oldsrc
          cp -a oldsrc v5src
      - name: Apply recovery and v5.0.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,textwrap
          src=Path('.github/workflows/munasabati-v5-hotfix-release-upgrade.yml').read_text()
          section=src[src.index('- name: Apply common compile fixes and v5.0.1 recovery hotfix'):]
          m=re.search(r"python - <<'PY'\n(.*?)\n\s+PY",section,re.S)
          if not m: raise SystemExit('recovery patch missing')
          Path('/tmp/recovery.py').write_text(textwrap.dedent(m.group(1)))
          PY
          python /tmp/recovery.py
          python .munasabati-v5-0-2/patch.py
          python .munasabati-v5-0-2/compilefix.py
          grep -q 'versionCode = 62' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.2"' v5src/app/build.gradle.kts
          grep -q 'sound_enabled' v5src/app/src/main/java/com/rafat/munasabati/compat/AppPreferences.kt
          grep -q 'haptic_enabled' v5src/app/src/main/java/com/rafat/munasabati/compat/AppPreferences.kt
          grep -q 'language' v5src/app/src/main/java/com/rafat/munasabati/compat/AppPreferences.kt
          grep -q 'حذف المناسبة' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q 'TrashManager' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q '© 2026 رأفت ناصر الناصر' v5src/app/src/main/java/com/rafat/munasabati/ui/SettingsAboutScreen.kt
          grep -q 'RingtoneManager' v5src/app/src/main/java/com/rafat/munasabati/reminder/ReminderEngine.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        working-directory: v5src
        run: gradle :app:testStableDebugUnitTest --stacktrace --no-daemon
      - name: Build release
        working-directory: v5src
        run: gradle :app:assembleStableRelease --stacktrace --no-daemon
      - name: Sign test release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find v5src/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          keytool -genkeypair -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati 5.0.2 Runtime Test,O=Munasabati,C=SA"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" /tmp/v502-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v502-test.apk /tmp/v502-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v502-test.apk
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r /tmp/v502-test.apk
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 10
            adb shell pidof com.rafat.munasabati
            adb logcat -d -t 1800 > /tmp/log.txt
            test -z "$(grep -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/log.txt || true)"
      - name: Collect release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp v5src/app/build/outputs/apk/stable/release/*.apk final/Munasabati-v5.0.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/zipalign
          sha256sum final/Munasabati-v5.0.2-unsigned.apk > final/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.2-final-passed
          path: final/*
          if-no-files-found: error
          retention-days: 14
