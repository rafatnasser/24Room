name: Munasabati v5.0.1 Exact Upgrade Gate V3

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5-hotfix-release-upgrade-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-upgrade-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore v5.0 source twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oldsrc
          cat .munasabati-v5/source.part*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d oldsrc
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/beta2.b64
          base64 --decode /tmp/beta2.b64 > /tmp/beta2.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/beta2.tgz" | sha256sum -c -
          tar -xzf /tmp/beta2.tgz -C oldsrc
          cat .munasabati-v5-stable/overlay.part*.b64 > /tmp/stable.b64
          base64 --decode /tmp/stable.b64 > /tmp/stable.tgz
          echo "995d93371091cb4cbce75d439d601b906899d39bafca1e04af29287138a64419  /tmp/stable.tgz" | sha256sum -c -
          tar -xzf /tmp/stable.tgz -C oldsrc
          cp -a oldsrc v5src

      - name: Apply audited v5.0.1 recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/munasabati-v5-hotfix-release-upgrade.yml').read_text()
          section=src[src.index('- name: Apply common compile fixes and v5.0.1 recovery hotfix'):]
          m=re.search(r"python - <<'PY'\n(.*?)\n\s+PY",section,re.S)
          if not m: raise SystemExit('recovery patch not found')
          Path('/tmp/apply-recovery.py').write_text(textwrap.dedent(m.group(1)))
          PY
          python /tmp/apply-recovery.py
          grep -q 'versionCode = 61' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.1"' v5src/app/build.gradle.kts
          grep -q 'isMinifyEnabled = false' v5src/app/build.gradle.kts
          grep -q 'const val VERSION = 3' v5src/app/src/main/java/com/rafat/munasabati/data/MunasabatiDatabase.kt
          grep -q 'private fun any(key:String)' v5src/app/src/main/java/com/rafat/munasabati/compat/PrivacyManager.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests Hotfix
        working-directory: v5src
        run: gradle :app:testStableDebugUnitTest --stacktrace --no-daemon

      - name: Build old and Hotfix Stable releases
        shell: bash
        run: |
          set -euo pipefail
          (cd oldsrc && gradle :app:assembleStableRelease --stacktrace --no-daemon)
          (cd v5src && gradle :app:assembleStableRelease --stacktrace --no-daemon)

      - name: Sign both releases with same CI certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati Upgrade Test,O=Munasabati,C=SA"
          OLD=$(find oldsrc/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          NEW=$(find v5src/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$OLD" /tmp/v5.0-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$NEW" /tmp/v5.0.1-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v5.0-test.apk /tmp/v5.0-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v5.0.1-test.apk /tmp/v5.0.1-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v5.0-test.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v5.0.1-test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exact Release upgrade with legacy data and partial-crash state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r /tmp/v5.0-test.apk
            adb root
            adb wait-for-device
            printf '%s' '' | base64 -d > /tmp/e.xml
            printf '%s' 'PD94bWwgdmVyc2lvbj0nMS4wJyBlbmNvZGluZz0ndXRmLTgnIHN0YW5kYWxvbmU9J3llcycgPz4KPG1hcD48c3RyaW5nIG5hbWU9ImFwcF9sb2NrX2VuYWJsZWQiPmZhbHNlPC9zdHJpbmc+PHN0cmluZyBuYW1lPSJoaWpyaV9vZmZzZXQiPjA8L3N0cmluZz48L21hcD4K' | base64 -d > /tmp/s.xml
            printf '%s' 'PD94bWwgdmVyc2lvbj0nMS4wJyBlbmNvZGluZz0ndXRmLTgnIHN0YW5kYWxvbmU9J3llcycgPz4KPG1hcD48c3RyaW5nIG5hbWU9InJlbWluZGVyc19lbmFibGVkIj50cnVlPC9zdHJpbmc+PC9tYXA+Cg==' | base64 -d > /tmp/a.xml
            adb shell mkdir -p /data/data/com.rafat.munasabati/shared_prefs
            adb push /tmp/e.xml /data/data/com.rafat.munasabati/shared_prefs/munasabati_events.xml
            adb push /tmp/s.xml /data/data/com.rafat.munasabati/shared_prefs/munasabati_settings.xml
            adb push /tmp/a.xml /data/data/com.rafat.munasabati/shared_prefs/munasabati_ahlbayt_calendar.xml
            U=$(adb shell stat -c %u /data/data/com.rafat.munasabati | tr -d '\r'); adb shell chown -R "$U:$U" /data/data/com.rafat.munasabati/shared_prefs; adb shell chmod 660 /data/data/com.rafat.munasabati/shared_prefs/*.xml
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity || true
            sleep 5
            adb shell am force-stop com.rafat.munasabati || true
            adb logcat -c
            adb install -r /tmp/v5.0.1-test.apk
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 15
            adb shell pidof com.rafat.munasabati
            adb logcat -d -t 2000 > /tmp/hotfix.log
            if grep -n -A100 -B30 -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/hotfix.log; then exit 1; fi
            adb shell test -f /data/data/com.rafat.munasabati/shared_prefs/munasabati_events.xml
            adb shell test -f /data/data/com.rafat.munasabati/databases/munasabati_v5.db
            adb pull /data/data/com.rafat.munasabati/databases/munasabati_v5.db /tmp/db.sqlite
            python -c "import sqlite3;db=sqlite3.connect('/tmp/db.sqlite');n=db.execute('select count(*) from events').fetchone()[0];titles={r[0] for r in db.execute('select title from events')};cols={r[1] for r in db.execute('pragma table_info(events)')};assert n>=2,n;assert 'مناسبة قديمة محفوظة' in titles,titles;assert {'recurrence','reminders_csv','strong_alert','calendar_fingerprint'}<=cols,cols;print('EXACT_RELEASE_UPGRADE_PASS',n)"

      - name: Collect final unsigned Hotfix and signing tools
        shell: bash
        run: |
          mkdir -p final
          cp v5src/app/build/outputs/apk/stable/release/*.apk final/Munasabati-v5.0.1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.1-exact-upgrade-v3-passed
          path: final/*
          if-no-files-found: error
          retention-days: 14
