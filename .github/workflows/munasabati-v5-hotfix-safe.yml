name: Munasabati v5.0.1 Fail Safe Upgrade Gate

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5-hotfix-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix-safe-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore v5.0 Stable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oldsrc
          cat .munasabati-v5/source.part*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d oldsrc
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/beta2.b64
          base64 --decode /tmp/beta2.b64 > /tmp/beta2.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/beta2.tgz" | sha256sum -c -
          tar -xzf /tmp/beta2.tgz -C oldsrc
          cat .munasabati-v5-stable/overlay.part*.b64 > /tmp/stable.b64
          base64 --decode /tmp/stable.b64 > /tmp/stable.tgz
          echo "995d93371091cb4cbce75d439d601b906899d39bafca1e04af29287138a64419  /tmp/stable.tgz" | sha256sum -c -
          tar -xzf /tmp/stable.tgz -C oldsrc
          cp -a oldsrc v5src

      - name: Apply fixture compile fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('oldsrc')
          p=root/'app/src/main/java/com/rafat/munasabati/compat/StrongAlertActivity.kt'
          p.write_text(p.read_text().replace('gravity=android.view.Gravity.CENTER;padding=48;setBackgroundColor','gravity=android.view.Gravity.CENTER;setPadding(48,48,48,48);setBackgroundColor'))
          p=root/'app/src/main/java/com/rafat/munasabati/ui/LegacyScreens.kt'
          p.write_text(p.read_text().replace('Icons.Default.DeleteRestore','Icons.Default.RestoreFromTrash').replace('@Composable fun AppLockGate(content:@Composable()->Unit){','@Composable fun AppLockGate(content: @Composable () -> Unit){'))
          p=root/'app/build.gradle.kts'
          s=p.read_text()
          marker='implementation("androidx.activity:activity-compose:1.11.0")'
          if 'androidx.fragment:fragment-ktx:1.8.5' not in s: s=s.replace(marker,marker+'\n    implementation("androidx.fragment:fragment-ktx:1.8.5")')
          if 'org.json:json:20240303' not in s: s=s.replace('testImplementation("junit:junit:4.13.2")','testImplementation("junit:junit:4.13.2")\n    testImplementation("org.json:json:20240303")')
          p.write_text(s)
          PY

      - name: Apply v5.0.1 fail-safe hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('v5src')

          p=root/'app/src/main/java/com/rafat/munasabati/compat/StrongAlertActivity.kt'
          p.write_text(p.read_text().replace('gravity=android.view.Gravity.CENTER;padding=48;setBackgroundColor','gravity=android.view.Gravity.CENTER;setPadding(48,48,48,48);setBackgroundColor'))
          p=root/'app/src/main/java/com/rafat/munasabati/ui/LegacyScreens.kt'
          p.write_text(p.read_text().replace('Icons.Default.DeleteRestore','Icons.Default.RestoreFromTrash').replace('@Composable fun AppLockGate(content:@Composable()->Unit){','@Composable fun AppLockGate(content: @Composable () -> Unit){'))

          p=root/'app/build.gradle.kts'
          s=p.read_text().replace('versionCode = 60','versionCode = 61').replace('versionName = "5.0.0"','versionName = "5.0.1"')
          marker='implementation("androidx.activity:activity-compose:1.11.0")'
          if 'androidx.fragment:fragment-ktx:1.8.5' not in s: s=s.replace(marker,marker+'\n    implementation("androidx.fragment:fragment-ktx:1.8.5")')
          if 'org.json:json:20240303' not in s: s=s.replace('testImplementation("junit:junit:4.13.2")','testImplementation("junit:junit:4.13.2")\n    testImplementation("org.json:json:20240303")')
          p.write_text(s)

          # Never perform legacy migration synchronously from Application.onCreate.
          p=root/'app/src/main/java/com/rafat/munasabati/MunasabatiApp.kt'
          s=p.read_text().replace('import com.rafat.munasabati.migration.LegacyV4Migration\n','').replace('        if (BuildConfig.CHANNEL == "stable") runCatching { LegacyV4Migration(this, repository).runOnce() }\n','')
          p.write_text(s)

          # Type-tolerant app-lock legacy preferences.
          p=root/'app/src/main/java/com/rafat/munasabati/compat/PrivacyManager.kt'
          p.write_text('''package com.rafat.munasabati.compat\n\nimport android.content.Context\nimport java.security.MessageDigest\n\nclass PrivacyManager(private val context:Context){\n    private val prefs=context.getSharedPreferences("munasabati_settings",Context.MODE_PRIVATE)\n    private fun bool(key:String, default:Boolean=false):Boolean = when(val v=runCatching{prefs.all[key]}.getOrNull()){\n        is Boolean -> v\n        is String -> v.equals("true",true) || v=="1"\n        is Number -> v.toInt()!=0\n        else -> default\n    }\n    private fun string(key:String):String? = when(val v=runCatching{prefs.all[key]}.getOrNull()){null->null;is String->v;else->v.toString()}\n    fun enabled()=bool("app_lock_enabled",false)\n    fun setEnabled(v:Boolean)=runCatching{prefs.edit().putBoolean("app_lock_enabled",v).apply()}.let{}\n    fun setPin(pin:String){runCatching{prefs.edit().putString("app_lock_pin_hash",hash(pin)).apply()}}\n    fun verify(pin:String)=string("app_lock_pin_hash")==hash(pin)\n    fun hasPin()=!string("app_lock_pin_hash").isNullOrBlank()\n    private fun hash(s:String)=MessageDigest.getInstance("SHA-256").digest(("munasabati|"+s).toByteArray()).joinToString(""){"%02x".format(it)}\n}\n''')

          # Harden AhlBayt startup setting against old string/int/boolean types.
          p=root/'app/src/main/java/com/rafat/munasabati/compat/AhlBaytCalendar.kt'
          s=p.read_text()
          old='context.getSharedPreferences("munasabati_ahlbayt_calendar",Context.MODE_PRIVATE).getBoolean("reminders_enabled",true)'
          new='runCatching { context.getSharedPreferences("munasabati_ahlbayt_calendar",Context.MODE_PRIVATE).all["reminders_enabled"] }.getOrNull().let { when(it){ is Boolean->it; is String->it.equals("true",true)||it=="1"; is Number->it.toInt()!=0; else->true } }'
          s=s.replace(old,new)
          p.write_text(s)

          # Harden SecureNotes old values.
          p=root/'app/src/main/java/com/rafat/munasabati/compat/SecureNotes.kt'
          s=p.read_text().replace('prefs.getString(eventId,null)?.let{runCatching{Base64.decode(it,Base64.NO_WRAP)}.getOrNull()}','runCatching { prefs.all[eventId]?.toString() }.getOrNull()?.let{runCatching{Base64.decode(it,Base64.NO_WRAP)}.getOrNull()}')
          p.write_text(s)

          # Harden trash/templates old pref types.
          p=root/'app/src/main/java/com/rafat/munasabati/compat/LegacyDataTools.kt'
          s=p.read_text()
          s=s.replace('fun items():JSONArray=runCatching{JSONArray(prefs.getString("items",prefs.getString("trash","[]"))?:"[]")}.getOrDefault(JSONArray())','fun items():JSONArray=runCatching{ val all=prefs.all; val raw=(all["items"]?:all["trash"]?:"[]").toString(); JSONArray(raw) }.getOrDefault(JSONArray())')
          s=s.replace('val raw=prefs.getString("templates",null)?:return built','val raw=runCatching{prefs.all["templates"]?.toString()}.getOrNull()?:return built')
          p.write_text(s)

          # Harden AhlBayt UI old pref type.
          p=root/'app/src/main/java/com/rafat/munasabati/ui/LegacyScreens.kt'
          s=p.read_text()
          old='var enabled by remember{mutableStateOf(prefs.getBoolean("reminders_enabled",true))}'
          new='var enabled by remember{mutableStateOf(runCatching{prefs.all["reminders_enabled"]}.getOrNull().let{when(it){is Boolean->it;is String->it.equals("true",true)||it=="1";is Number->it.toInt()!=0;else->true}})}'
          s=s.replace(old,new)
          p.write_text(s)

          # Loss-averse legacy migration: every pref/event independent and raw events type tolerant.
          p=root/'app/src/main/java/com/rafat/munasabati/migration/LegacyV4Migration.kt'
          s=p.read_text()
          s=s.replace('''        val snapshot = JSONObject()\n        for (name in prefNames) {\n            val all = context.getSharedPreferences(name, Context.MODE_PRIVATE).all\n            if (all.isNotEmpty()) {\n                val stored = JSONObject()\n                all.forEach { (k, v) -> stored.put(k, encodePrefValue(v)) }\n                snapshot.put(name, stored)\n            }\n        }\n''','''        val snapshot = JSONObject()\n        val notes = mutableListOf<String>()\n        for (name in prefNames) {\n            runCatching {\n                val all = context.getSharedPreferences(name, Context.MODE_PRIVATE).all\n                if (all.isNotEmpty()) {\n                    val stored = JSONObject()\n                    all.forEach { (k, v) -> runCatching { stored.put(k, encodePrefValue(v)) } }\n                    snapshot.put(name, stored)\n                }\n            }.onFailure { notes += "snapshot_failed:$name" }\n        }\n''')
          s=s.replace('''        val backup = File(context.filesDir, "legacy-v4-snapshot-${System.currentTimeMillis()}.json").apply { writeText(snapshot.toString(2)) }\n        repo.putMeta("legacy_v4_backup", backup.absolutePath)\n        repo.putMeta("legacy_v4_snapshot_version", "4.8-compatible")\n''','''        val backup = runCatching { File(context.filesDir, "legacy-v4-snapshot-${System.currentTimeMillis()}.json").apply { writeText(snapshot.toString(2)) } }.getOrNull()\n        backup?.let { repo.putMeta("legacy_v4_backup", it.absolutePath) }\n        repo.putMeta("legacy_v4_snapshot_version", "4.8-compatible")\n''')
          s=s.replace('val rawEvents = activePref.getString("events", "[]") ?: "[]"','val rawEvents = runCatching { activePref.all["events"]?.toString() }.getOrNull() ?: "[]"')
          s=s.replace('''        for (i in 0 until array.length()) {\n            val obj = array.optJSONObject(i) ?: continue\n            parseV4Event(obj)?.let { event ->\n                val fingerprint = "${event.id}|${event.title}|${event.startEpochMillis}"\n                if (seen.add(fingerprint)) {\n                    repo.upsertEvent(event)\n                    event.attachmentUri?.takeIf { it.isNotBlank() }?.let { repo.addMedia(event.id, it, event.attachmentType.ifBlank { "attachment" }) }\n                    imported++\n                }\n            }\n        }\n''','''        for (i in 0 until array.length()) {\n            val obj = array.optJSONObject(i) ?: continue\n            runCatching {\n                parseV4Event(obj)?.let { event ->\n                    val fingerprint = "${event.id}|${event.title}|${event.startEpochMillis}"\n                    if (seen.add(fingerprint)) {\n                        repo.upsertEvent(event)\n                        event.attachmentUri?.takeIf { it.isNotBlank() }?.let { repo.addMedia(event.id, it, event.attachmentType.ifBlank { "attachment" }) }\n                        imported++\n                    }\n                }\n            }.onFailure { notes += "event_failed:$i:${it.javaClass.simpleName}" }\n        }\n''')
          s=s.replace('return Result(true, imported, backup.absolutePath, listOf("legacy_data_preserved", "exact_v4_event_mapping", "legacy_features_snapshot_preserved"))','return Result(true, imported, backup?.absolutePath, notes + listOf("legacy_data_preserved", "exact_v4_event_mapping", "legacy_features_snapshot_preserved"))')
          p.write_text(s)

          # Self-repair partially-created v5 DB and bump schema.
          p=root/'app/src/main/java/com/rafat/munasabati/data/MunasabatiDatabase.kt'
          s=p.read_text().replace('            additions.forEach { definition -> db.execSQL("ALTER TABLE events ADD COLUMN $definition") }','            additions.forEach { definition -> runCatching { db.execSQL("ALTER TABLE events ADD COLUMN $definition") } }')
          needle='''    companion object { const val DB_NAME = "munasabati_v5.db"; const val VERSION = 2 }\n}'''
          replacement='''    override fun onOpen(db: SQLiteDatabase) {\n        super.onOpen(db)\n        runCatching { repairSchema(db) }\n    }\n    private fun repairSchema(db: SQLiteDatabase) {\n        db.execSQL("CREATE TABLE IF NOT EXISTS app_meta(key TEXT PRIMARY KEY, value TEXT)")\n        db.execSQL("CREATE TABLE IF NOT EXISTS people(id TEXT PRIMARY KEY, contact_uri TEXT, name TEXT NOT NULL, phone TEXT, relationship TEXT NOT NULL DEFAULT '', last_interaction_at INTEGER)")\n        db.execSQL("CREATE TABLE IF NOT EXISTS interactions(id INTEGER PRIMARY KEY AUTOINCREMENT, person_id TEXT NOT NULL, event_id TEXT, kind TEXT NOT NULL, created_at INTEGER NOT NULL)")\n        db.execSQL("CREATE TABLE IF NOT EXISTS event_media(id INTEGER PRIMARY KEY AUTOINCREMENT, event_id TEXT NOT NULL, uri TEXT NOT NULL, kind TEXT NOT NULL DEFAULT 'image')")\n        val cols=mutableSetOf<String>()\n        runCatching { db.rawQuery("PRAGMA table_info(events)",null).use{c->val i=c.getColumnIndex("name");while(c.moveToNext())if(i>=0)cols+=c.getString(i)} }\n        if(cols.isEmpty()){\n            runCatching { db.execSQL("CREATE TABLE IF NOT EXISTS events(id TEXT PRIMARY KEY,title TEXT NOT NULL,start_ms INTEGER NOT NULL,end_ms INTEGER NOT NULL,category TEXT NOT NULL,importance INTEGER NOT NULL DEFAULT 1,location_name TEXT NOT NULL DEFAULT '',latitude REAL,longitude REAL,person_id TEXT,notes TEXT NOT NULL DEFAULT '',status TEXT NOT NULL DEFAULT 'UPCOMING',attended INTEGER NOT NULL DEFAULT 0,reminder_minutes INTEGER NOT NULL DEFAULT 60,arrive_reminder INTEGER NOT NULL DEFAULT 0,acknowledged INTEGER NOT NULL DEFAULT 0,recurrence TEXT NOT NULL DEFAULT 'none',reminders_csv TEXT NOT NULL DEFAULT '',attachment_uri TEXT,attachment_name TEXT NOT NULL DEFAULT '',attachment_type TEXT NOT NULL DEFAULT '',location_url TEXT NOT NULL DEFAULT '',legacy_color TEXT NOT NULL DEFAULT '',favorite INTEGER NOT NULL DEFAULT 0,pinned INTEGER NOT NULL DEFAULT 0,strong_alert INTEGER NOT NULL DEFAULT 0,calendar_id INTEGER,calendar_event_id INTEGER,calendar_sync INTEGER NOT NULL DEFAULT 0,calendar_fingerprint TEXT NOT NULL DEFAULT '',legacy_json TEXT NOT NULL DEFAULT '',created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)") }\n        } else {\n            val defs=linkedMapOf("recurrence" to "TEXT NOT NULL DEFAULT 'none'","reminders_csv" to "TEXT NOT NULL DEFAULT ''","attachment_uri" to "TEXT","attachment_name" to "TEXT NOT NULL DEFAULT ''","attachment_type" to "TEXT NOT NULL DEFAULT ''","location_url" to "TEXT NOT NULL DEFAULT ''","legacy_color" to "TEXT NOT NULL DEFAULT ''","favorite" to "INTEGER NOT NULL DEFAULT 0","pinned" to "INTEGER NOT NULL DEFAULT 0","strong_alert" to "INTEGER NOT NULL DEFAULT 0","calendar_id" to "INTEGER","calendar_event_id" to "INTEGER","calendar_sync" to "INTEGER NOT NULL DEFAULT 0","calendar_fingerprint" to "TEXT NOT NULL DEFAULT ''","legacy_json" to "TEXT NOT NULL DEFAULT ''")\n            defs.forEach{(n,d)->if(n !in cols)runCatching{db.execSQL("ALTER TABLE events ADD COLUMN $n $d")}}\n        }\n        runCatching{db.execSQL("CREATE INDEX IF NOT EXISTS idx_events_start ON events(start_ms)")}\n        runCatching{db.execSQL("CREATE INDEX IF NOT EXISTS idx_events_person ON events(person_id)")}\n    }\n    companion object { const val DB_NAME = "munasabati_v5.db"; const val VERSION = 3 }\n}'''
          if needle not in s: raise SystemExit('DB marker not found')
          p.write_text(s.replace(needle,replacement))

          # Render a safe startup screen first; migration happens after composition and cannot kill the process.
          p=root/'app/src/main/java/com/rafat/munasabati/ui/AppUi.kt'
          s=p.read_text()
          if 'import com.rafat.munasabati.migration.LegacyV4Migration' not in s: s=s.replace('import com.rafat.munasabati.model.*','import com.rafat.munasabati.model.*\nimport com.rafat.munasabati.migration.LegacyV4Migration')
          old='''@Composable fun MunasabatiRoot() {\n    AppLockGate {\n    val nav = rememberNavController()\n    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {\n'''
          new='''@Composable fun MunasabatiRoot() {\n    val context=LocalContext.current\n    var startupReady by remember{mutableStateOf(BuildConfig.CHANNEL!="stable")}\n    LaunchedEffect(Unit){\n        if(BuildConfig.CHANNEL=="stable"){\n            withContext(Dispatchers.IO){ runCatching{ LegacyV4Migration(context,repo(context)).runOnce() } }\n            startupReady=true\n        }\n    }\n    if(!startupReady){\n        CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl){\n            Box(Modifier.fillMaxSize().padding(28.dp),contentAlignment=Alignment.Center){Column(horizontalAlignment=Alignment.CenterHorizontally,verticalArrangement=Arrangement.spacedBy(14.dp)){CircularProgressIndicator();Text("مناسباتي",fontSize=28.sp,fontWeight=FontWeight.Bold);Text("جاري تجهيز بياناتك بأمان…",textAlign=TextAlign.Center)}}\n        }\n        return\n    }\n    AppLockGate {\n    val nav = rememberNavController()\n    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {\n'''
          if old not in s: raise SystemExit('UI root marker not found')
          s=s.replace(old,new)
          old2='    LaunchedEffect(Unit) { buckets = withContext(Dispatchers.IO) { repo(context).smartBuckets() } }'
          new2='    LaunchedEffect(Unit) { buckets = withContext(Dispatchers.IO) { runCatching { repo(context).smartBuckets() }.getOrElse { SmartCenterBuckets(emptyList(),emptyList(),emptyList(),emptyList(),emptyList()) } } }'
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
          grep -q 'versionCode = 61' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.1"' v5src/app/build.gradle.kts
          grep -q 'const val VERSION = 3' v5src/app/src/main/java/com/rafat/munasabati/data/MunasabatiDatabase.kt
          grep -q 'جاري تجهيز بياناتك بأمان' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests Hotfix
        working-directory: v5src
        run: gradle :app:testStableDebugUnitTest --stacktrace --no-daemon
      - name: Build v5.0 fixture
        working-directory: oldsrc
        run: gradle :app:assembleStableDebug --stacktrace --no-daemon
      - name: Build v5.0.1 Hotfix
        working-directory: v5src
        run: gradle :app:assembleStableDebug --stacktrace --no-daemon

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real recovery upgrade test with legacy data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            PKG=com.rafat.munasabati.debug
            adb install -r oldsrc/app/build/outputs/apk/stable/debug/*.apk
            cat > /tmp/munasabati_events.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map><string name="events">[{"id":"legacy-1","title":"مناسبة قديمة محفوظة","category":"عائلية","recurrence":"yearly","details":"تفاصيل من الإصدار السابق","eventTime":1788210000000,"reminderMinutes":60,"remindersCsv":"60,1440","attachmentUri":"content://legacy/item/1","attachmentName":"دعوة.pdf","attachmentType":"application/pdf","locationName":"الدمام","locationUrl":"geo:26.4,50.1","color":"#2E7D6E","favorite":true,"pinned":true,"strongAlert":true,"calendarSync":true,"calendarId":"not-a-number","calendarEventId":123,"calendarFingerprint":"abc","updatedAt":1788200000000},{"id":22,"title":"مناسبة ثانية","category":"WORK","eventTime":1788296400000,"remindersCsv":"30,120"},{"id":"bad","title":"سجل غير صالح","eventTime":"broken"}]</string></map>
            XML
            cat > /tmp/munasabati_settings.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map><string name="app_lock_enabled">false</string><string name="hijri_offset">0</string></map>
            XML
            cat > /tmp/ahl.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map><string name="reminders_enabled">true</string></map>
            XML
            adb push /tmp/munasabati_events.xml /data/local/tmp/e.xml >/dev/null
            adb push /tmp/munasabati_settings.xml /data/local/tmp/s.xml >/dev/null
            adb push /tmp/ahl.xml /data/local/tmp/a.xml >/dev/null
            adb shell run-as "$PKG" mkdir -p shared_prefs
            adb shell run-as "$PKG" cp /data/local/tmp/e.xml shared_prefs/munasabati_events.xml
            adb shell run-as "$PKG" cp /data/local/tmp/s.xml shared_prefs/munasabati_settings.xml
            adb shell run-as "$PKG" cp /data/local/tmp/a.xml shared_prefs/munasabati_ahlbayt_calendar.xml
            # Allow v5.0 to hit the same legacy data first. A crash here is allowed and simulates the user's state.
            adb shell am start -W -n "$PKG/com.rafat.munasabati.MainActivity" || true
            sleep 5
            adb shell am force-stop "$PKG" || true
            # Install hotfix over the same app data. Never clear/uninstall.
            adb logcat -c
            adb install -r v5src/app/build/outputs/apk/stable/debug/*.apk
            adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n "$PKG/com.rafat.munasabati.MainActivity"
            sleep 12
            adb shell pidof "$PKG"
            adb logcat -d -t 1600 > /tmp/hotfix.log
            if grep -E 'FATAL EXCEPTION|Process: com.rafat.munasabati.debug' /tmp/hotfix.log; then exit 1; fi
            adb shell run-as "$PKG" test -f shared_prefs/munasabati_events.xml
            adb shell run-as "$PKG" test -f databases/munasabati_v5.db
            adb exec-out run-as "$PKG" cat databases/munasabati_v5.db > /tmp/munasabati_v5.db
            python - <<'PY'
            import sqlite3
            db=sqlite3.connect('/tmp/munasabati_v5.db')
            tables={r[0] for r in db.execute("select name from sqlite_master where type='table'")}
            assert 'events' in tables, tables
            n=db.execute('select count(*) from events').fetchone()[0]
            assert n >= 2, n
            cols={r[1] for r in db.execute('pragma table_info(events)')}
            for c in ['recurrence','reminders_csv','strong_alert','calendar_fingerprint']:
                assert c in cols, c
            print('MIGRATED_EVENT_COUNT',n)
            PY

      - name: Build unsigned v5.0.1 Stable release
        working-directory: v5src
        run: gradle :app:assembleStableRelease --stacktrace --no-daemon
      - name: Collect signing utility
        shell: bash
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tool/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.1-failsafe-unsigned
          path: |
            v5src/app/build/outputs/apk/stable/release/*.apk
            signing-tool/apksigner.jar
            signing-tool/zipalign
          if-no-files-found: error
          retention-days: 14
