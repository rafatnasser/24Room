name: Build LAN Guardian APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lan-guardian-android/**'
      - '.github/workflows/build-lan-guardian-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable debug APK
        working-directory: lan-guardian-android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp lan-guardian-android/app/build/outputs/apk/debug/app-debug.apk LAN-Guardian.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Guardian-APK
          path: LAN-Guardian.apk
          if-no-files-found: error
          retention-days: 7
