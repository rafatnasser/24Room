name: Bootstrap bkcrack utility
on:
  push:
    branches: ["munasabati-v5-build"]
    paths: ['.github/workflows/tool-bkcrack-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download official bkcrack release
        run: |
          set -euo pipefail
          curl -fL https://github.com/kimci86/bkcrack/releases/download/v1.8.1/bkcrack-1.8.1-Linux-x86_64.tar.gz -o /tmp/bk.tar.gz
          mkdir -p /tmp/bk
          tar -xzf /tmp/bk.tar.gz -C /tmp/bk
          BIN=$(find /tmp/bk -type f -name bkcrack -perm -111 | head -1)
          test -n "$BIN"
          cp "$BIN" /tmp/bkcrack
          /tmp/bkcrack -h >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: bkcrack-linux-x86_64
          path: /tmp/bkcrack
          retention-days: 1
