name: Munasabati v5.8 Final Quality

on:
  push:
    branches: [ "munasabati-v5.8-build" ]
    paths: [ '.github/workflows/munasabati-v5.8-final-quality.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact v5.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-v502-brand/source.part*.b64 > /tmp/v502.b64
          base64 --decode /tmp/v502.b64 > /tmp/v502.tgz
          mkdir -p v5src
          tar -xzf /tmp/v502.tgz -C v5src
          python .munasabati-v5.0.3-final/apply_userfix503.py v5src
          base64 --decode .munasabati-v5.0.4/v504.patch.gz.b64 | gunzip > /tmp/v504.patch
          patch -p1 -d v5src < /tmp/v504.patch
          cat .munasabati-v5.1.0/parts/part* > /tmp/v510.patch.gz.b64
          base64 --decode /tmp/v510.patch.gz.b64 | gunzip > /tmp/v510.patch
          patch -p1 -d v5src < /tmp/v510.patch
          python .munasabati-v5.2.0/apply_v520.py v5src .munasabati-v5.2.0
          python .munasabati-v5.2.1/apply_v521.py v5src
          python .munasabati-v5.2.2/apply_v522.py v5src .munasabati-v5.2.2
          python .munasabati-v5.2.3/apply_v523.py v5src .munasabati-v5.2.3
          python .munasabati-v5.2.4/apply_v524.py v5src .munasabati-v5.2.4
          python .munasabati-v5.2.5/apply_v525.py v5src .munasabati-v5.2.5
          python .munasabati-v5.2.6/apply_v526.py v5src .munasabati-v5.2.6
          python .munasabati-v5.3.0/apply_v530.py v5src .munasabati-v5.3.0
          cat .munasabati-v5.4/parts/part* > /tmp/v540.patch.gz.b64
          base64 --decode /tmp/v540.patch.gz.b64 | gunzip > /tmp/v540.patch
          patch -p1 -d v5src < /tmp/v540.patch
          cat .munasabati-v5.5/parts/part* > /tmp/v550.patch.gz.b64
          base64 --decode /tmp/v550.patch.gz.b64 | gunzip > /tmp/v550.patch
          patch -p1 -d v5src < /tmp/v550.patch
          grep -q 'import androidx.compose.animation.togetherWith' v5src/app/src/main/java/com/rafat/munasabati/ui/V55Experience.kt || sed -i '/import androidx.compose.animation.fadeOut/a import androidx.compose.animation.togetherWith' v5src/app/src/main/java/com/rafat/munasabati/ui/V55Experience.kt
          base64 --decode .munasabati-v5.6/v560.patch.gz.b64 | gunzip > /tmp/v560.patch
          patch -p1 -d v5src < /tmp/v560.patch
          cat .munasabati-v5.7/parts/part* > /tmp/v570.patch.gz.b64
          base64 --decode /tmp/v570.patch.gz.b64 | gunzip > /tmp/v570.patch
          patch -p1 -d v5src < /tmp/v570.patch
          grep -q 'versionCode = 130' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.7.0"' v5src/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Build v5.7 upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:assembleStableRelease --stacktrace --no-daemon
          cp "$(find v5src/app/build/outputs/apk/stable/release -type f -name '*.apk' | head -1)" /tmp/v570-unsigned.apk
      - name: Apply v5.8 release
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5.8/parts/part* > /tmp/v580.patch.gz.b64
          base64 --decode /tmp/v580.patch.gz.b64 | gunzip > /tmp/v580.patch
          patch -p1 -d v5src < /tmp/v580.patch
          patch -p1 -d v5src < .munasabati-v5.8/fixes/appui-composable-fix.patch
          grep -q 'versionCode = 140' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.8.0"' v5src/app/build.gradle.kts
          grep -q 'class CloudSyncEngine' v5src/app/src/main/java/com/rafat/munasabati/cloud/CloudSync.kt
          grep -q 'class CloudCredentialStore' v5src/app/src/main/java/com/rafat/munasabati/cloud/CloudSync.kt
          grep -q 'class CustomEventWidgetProvider' v5src/app/src/main/java/com/rafat/munasabati/widget/SmartWidgetSupport.kt
          grep -q 'object WidgetSmartScheduler' v5src/app/src/main/java/com/rafat/munasabati/widget/SmartWidgetSupport.kt
          grep -q 'object UsageSmartSuggestionEngine' v5src/app/src/main/java/com/rafat/munasabati/smart/UsageSmartSuggestionEngine.kt
          grep -q 'enum class EventCardTemplate' v5src/app/src/main/java/com/rafat/munasabati/share/ShareTools.kt
          grep -q 'fun V58AccessibilityScreen' v5src/app/src/main/java/com/rafat/munasabati/ui/V58Experience.kt
          grep -q 'PBKDF2WithHmacSHA256' v5src/app/src/main/java/com/rafat/munasabati/compat/PrivacyManager.kt
          grep -q 'Lifecycle.Event.ON_STOP' v5src/app/src/main/java/com/rafat/munasabati/ui/LegacyScreens.kt
          test -f v5src/app/src/androidTest/java/com/rafat/munasabati/V55QualityInstrumentedTest.kt
          test -f v5src/app/src/androidTest/java/com/rafat/munasabati/V57QualityInstrumentedTest.kt
          test -f v5src/app/src/androidTest/java/com/rafat/munasabati/V58QualityInstrumentedTest.kt
      - name: Unit tests and APK builds
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v5src :app:testStableDebugUnitTest --stacktrace --no-daemon
          gradle -p v5src :app:assembleStableDebug :app:assembleStableRelease :app:assembleStableDebugAndroidTest --stacktrace --no-daemon
          cp "$(find v5src/app/build/outputs/apk/stable/release -type f -name '*.apk' | head -1)" /tmp/v580-unsigned.apk
      - name: Sign v5.7 and v5.8 upgrade pair with test certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati 580 Upgrade Test,O=Munasabati,C=SA"
          for v in 570 580; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "/tmp/v${v}-unsigned.apk" "/tmp/v${v}-aligned.apk"
            java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out "/tmp/v${v}.apk" "/tmp/v${v}-aligned.apk"
            java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose "/tmp/v${v}.apk"
          done
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 regression and v5.7 to v5.8 upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            gradle -p v5src :app:connectedStableDebugAndroidTest --stacktrace --no-daemon
            adb uninstall com.rafat.munasabati || true
            adb install /tmp/v570.apk
            adb root || true
            adb wait-for-device
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.rafat.munasabati android.permission.READ_CALENDAR || true
            adb shell pm grant com.rafat.munasabati android.permission.WRITE_CALENDAR || true
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 8
            adb shell mkdir -p /data/user/0/com.rafat.munasabati/files
            adb shell 'echo keep-v580 > /data/user/0/com.rafat.munasabati/files/v580-upgrade-sentinel.txt'
            adb logcat -c || true
            adb install -r /tmp/v580.apk
            adb shell pm grant com.rafat.munasabati android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.rafat.munasabati android.permission.READ_CALENDAR || true
            adb shell pm grant com.rafat.munasabati android.permission.WRITE_CALENDAR || true
            adb shell am force-stop com.rafat.munasabati
            adb shell am start -W -n com.rafat.munasabati/com.rafat.munasabati.MainActivity
            sleep 14
            adb shell pidof com.rafat.munasabati
            adb shell cat /data/user/0/com.rafat.munasabati/files/v580-upgrade-sentinel.txt | grep -q keep-v580
            adb shell dumpsys package com.rafat.munasabati | grep -q 'versionCode=140'
            adb logcat -d > /tmp/v580.log 2>/tmp/v580-logcat.err || true
            test -z "$(grep -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/v580.log || true)"
            echo V580_ALL_SERVICE_WIDGET_AND_UPGRADE_TESTS_PASS
      - name: Package validated release and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final/tools/lib64
          cp /tmp/v580-unsigned.apk final/Munasabati-v5.8.0-FINAL-unsigned.apk
          tar -czf final/Munasabati-v5.8.0-SOURCE.tgz -C v5src .
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/tools/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" final/tools/lib64/libc++.so
          chmod +x final/tools/zipalign
          sha256sum final/Munasabati-v5.8.0-FINAL-unsigned.apk > final/unsigned-sha256.txt
          printf 'version=5.8.0\nversionCode=140\npackage=com.rafat.munasabati\noptional-cloud-sync=PASS\ncloud-credentials-keystore=PASS\nsecure-notes-excluded-from-cloud=PASS\nexternal-calendar-excluded-from-cloud=PASS\nsmart-widget-refresh=PASS\ncustom-widget-builder=PASS\nusage-smart-suggestions=PASS\ndesigned-event-sharing=PASS\nadvanced-accessibility=PASS\nprivacy-lock-regression=PASS\nsecure-notes-regression=PASS\nbackup-restore-regression=PASS\ncalendar-regression=PASS\nreminder-regression=PASS\nunit-tests=PASS\nandroid-instrumentation=PASS\nupgrade-5.7-to-5.8=PASS\ndata-preservation=PASS\nno-fatal-crash=PASS\n' > final/Munasabati-v5.8.0-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.8.0-final-quality-passed
          path: final/**
          if-no-files-found: error
          retention-days: 7
