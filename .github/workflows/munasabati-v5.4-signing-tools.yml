name: Munasabati v5.4 Signing Tools

on:
  push:
    branches: [ "munasabati-v5.4-build" ]
    paths:
      - '.github/workflows/munasabati-v5.4-signing-tools.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;36.0.0"
      - name: Package Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" tools/zipalign
          chmod +x tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.4-signing-tools
          path: tools/*
          if-no-files-found: error
          retention-days: 2
