name: Munasabati Export Exact v5.0.4 Source

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-export-v504-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact v5.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat .munasabati-v5-v502-brand/source.part*.b64 > /tmp/v502.b64
          base64 --decode /tmp/v502.b64 > /tmp/v502.tgz
          echo "35a933424119294e80c930a5f14fb6bf7c4e607a1cdcb7c505716a96c076d2e0  /tmp/v502.tgz" | sha256sum -c -
          mkdir -p v5src
          tar -xzf /tmp/v502.tgz -C v5src
          python .munasabati-v5.0.3-final/apply_userfix503.py v5src
          base64 --decode .munasabati-v5.0.4/v504.patch.gz.b64 | gunzip > /tmp/v504.patch
          patch -p1 -d v5src < /tmp/v504.patch
          grep -q 'versionCode = 64' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.4"' v5src/app/build.gradle.kts
          tar -czf /tmp/Munasabati-v5.0.4-exact-source.tgz -C v5src .
          sha256sum /tmp/Munasabati-v5.0.4-exact-source.tgz > /tmp/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.4-exact-source
          path: |
            /tmp/Munasabati-v5.0.4-exact-source.tgz
            /tmp/source-sha256.txt
          if-no-files-found: error
          retention-days: 7
