name: Munasabati signing utility bootstrap

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-signing-tool-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified bkcrack utility
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/bkcrack.tar.gz https://github.com/kimci86/bkcrack/releases/download/v1.8.1/bkcrack-1.8.1-Linux-x86_64.tar.gz
          echo "45dc7d81adbaaad5c0aa2d8615ea920fd08b732fda1ea945504e0a3e8dc1d2ab  /tmp/bkcrack.tar.gz" | sha256sum -c -
          mkdir /tmp/bkcrack
          tar -xzf /tmp/bkcrack.tar.gz -C /tmp/bkcrack
          find /tmp/bkcrack -type f -name bkcrack -exec chmod +x {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: bkcrack-linux-x86_64
          path: /tmp/bkcrack
          retention-days: 1
