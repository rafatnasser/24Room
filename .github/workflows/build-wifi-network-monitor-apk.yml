name: Build WiFi Network Monitor APK

on:
  push:
    branches:
      - wifi-network-monitor-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: wifi-apk-builder
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp wifi-apk-builder/app/build/outputs/apk/debug/app-debug.apk WiFi_Network_Monitor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi_Network_Monitor_APK
          path: WiFi_Network_Monitor.apk
          if-no-files-found: error
