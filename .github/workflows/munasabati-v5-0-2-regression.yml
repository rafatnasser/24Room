name: Munasabati v5.0.2 Regression Gate

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5-0-2-regression.yml'
      - '.munasabati-v5-0-2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore stable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5src
          cat .munasabati-v5/source.part*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d v5src
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/beta2.b64
          base64 --decode /tmp/beta2.b64 > /tmp/beta2.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/beta2.tgz" | sha256sum -c -
          tar -xzf /tmp/beta2.tgz -C v5src
          cat .munasabati-v5-stable/overlay.part*.b64 > /tmp/stable.b64
          base64 --decode /tmp/stable.b64 > /tmp/stable.tgz
          echo "995d93371091cb4cbce75d439d601b906899d39bafca1e04af29287138a64419  /tmp/stable.tgz" | sha256sum -c -
          tar -xzf /tmp/stable.tgz -C v5src

      - name: Apply v5.0.1 recovery base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/munasabati-v5-hotfix-release-upgrade.yml').read_text()
          marker='- name: Apply common compile fixes and v5.0.1 recovery hotfix'
          section=src[src.index(marker):]
          m=re.search(r"python - <<'PY'\n(.*?)\n\s+PY", section, re.S)
          if not m: raise SystemExit('recovery patch not found')
          code=textwrap.dedent(m.group(1))
          Path('/tmp/apply-recovery.py').write_text(code)
          PY
          python /tmp/apply-recovery.py

      - name: Apply v5.0.2 regression patch
        shell: bash
        run: |
          set -euo pipefail
          python .munasabati-v5-0-2/patch.py
          grep -q 'versionCode = 62' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.2"' v5src/app/build.gradle.kts
          grep -q 'sound_enabled' v5src/app/src/main/java/com/rafat/munasabati/compat/AppPreferences.kt
          grep -q 'LocalAppLanguage' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q 'حذف المناسبة' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q '© 2026 رأفت ناصر الناصر' v5src/app/src/main/java/com/rafat/munasabati/ui/SettingsAboutScreen.kt
          grep -q 'fun cancel(eventId:String)' v5src/app/src/main/java/com/rafat/munasabati/reminder/ReminderEngine.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests
        working-directory: v5src
        run: gradle :app:testStableDebugUnitTest --stacktrace --no-daemon

      - name: Build stable release
        working-directory: v5src
        run: gradle :app:assembleStableRelease --stacktrace --no-daemon

      - name: Sign release for emulator test
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find v5src/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          keytool -genkeypair -v -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati 5.0.2 Test,O=Munasabati,C=SA"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" /tmp/v502-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v502-test.apk /tmp/v502-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v502-test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime regression Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            PKG=com.rafat.munasabati
            adb install -r /tmp/v502-test.apk
            adb root
            adb wait-for-device
            adb shell am force-stop "$PKG" || true
            printf '%s' '' | base64 -d > /tmp/events.xml
            printf '%s' '' | base64 -d > /tmp/settings.xml
            adb push /tmp/events.xml /data/local/tmp/events.xml >/dev/null
            adb push /tmp/settings.xml /data/local/tmp/settings.xml >/dev/null
            adb shell mkdir -p /data/data/$PKG/shared_prefs
            adb shell cp /data/local/tmp/events.xml /data/data/$PKG/shared_prefs/munasabati_events.xml
            adb shell cp /data/local/tmp/settings.xml /data/data/$PKG/shared_prefs/munasabati_settings.xml
            adb shell chown -R $(adb shell stat -c %u /data/data/$PKG):$(adb shell stat -c %g /data/data/$PKG) /data/data/$PKG/shared_prefs
            adb logcat -c
            adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n "$PKG/com.rafat.munasabati.MainActivity"
            sleep 12
            adb shell pidof "$PKG"
            adb logcat -d -t 2000 > /tmp/v502.log
            if grep -n -A80 -B20 -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/v502.log; then exit 1; fi
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q 'Munasabati' /tmp/window.xml
            grep -q 'More' /tmp/window.xml
            adb shell input tap 965 2150 || true
            sleep 3
            adb shell uiautomator dump /sdcard/more.xml >/dev/null
            adb pull /sdcard/more.xml /tmp/more.xml >/dev/null
            grep -Eq 'Rafat Nasser Alnasser|رأفت ناصر الناصر' /tmp/more.xml
            grep -Eq 'Settings|الإعدادات' /tmp/more.xml
            adb exec-out run-as "$PKG" cat shared_prefs/munasabati_settings.xml > /tmp/settings-out.xml || adb shell cat /data/data/$PKG/shared_prefs/munasabati_settings.xml > /tmp/settings-out.xml
            grep -q 'language' /tmp/settings-out.xml
            grep -q 'sound_enabled' /tmp/settings-out.xml

      - name: Collect final unsigned release and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp v5src/app/build/outputs/apk/stable/release/*.apk final/Munasabati-v5.0.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/zipalign
          sha256sum final/Munasabati-v5.0.2-unsigned.apk > final/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.2-regression-passed
          path: final/*
          if-no-files-found: error
          retention-days: 14
