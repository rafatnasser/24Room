name: Munasabati v5.0.2 UX Restore Gate

on:
  push:
    branches: [ "munasabati-v5-build" ]
    paths:
      - '.github/workflows/munasabati-v5.0.2-ux-restore.yml'
      - '.munasabati-v5.0.2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Restore v5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5src
          cat .munasabati-v5/source.part*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "a1717136bd5d402a65cc8a6b8341c83c7ef74d6b0cf19650b784dc12d42ce34f  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d v5src
          cat .munasabati-v5-beta2/overlay.part*.b64 > /tmp/beta2.b64
          base64 --decode /tmp/beta2.b64 > /tmp/beta2.tgz
          echo "f006f8def9552dddef974ff56e91856da38d3e6144896d0622132deb8c91b707  /tmp/beta2.tgz" | sha256sum -c -
          tar -xzf /tmp/beta2.tgz -C v5src
          cat .munasabati-v5-stable/overlay.part*.b64 > /tmp/stable.b64
          base64 --decode /tmp/stable.b64 > /tmp/stable.tgz
          echo "995d93371091cb4cbce75d439d601b906899d39bafca1e04af29287138a64419  /tmp/stable.tgz" | sha256sum -c -
          tar -xzf /tmp/stable.tgz -C v5src

      - name: Apply proven v5.0.1 recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/munasabati-v5-hotfix-release-upgrade.yml').read_text()
          section=src[src.index('- name: Apply common compile fixes and v5.0.1 recovery hotfix'):]
          m=re.search(r"python - <<'PY'\n(.*?)\n\s+PY",section,re.S)
          if not m: raise SystemExit('v5.0.1 recovery patch not found')
          Path('/tmp/apply-recovery.py').write_text(textwrap.dedent(m.group(1)))
          PY
          # Recovery script expects oldsrc and v5src.
          cp -a v5src oldsrc
          python /tmp/apply-recovery.py
          grep -q 'versionCode = 61' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.1"' v5src/app/build.gradle.kts
          rm -rf oldsrc
          cp -a v5src old501

      - name: Apply v5.0.2 UX restore patch
        shell: bash
        run: |
          set -euo pipefail
          python .munasabati-v5.0.2/apply.py
          grep -q 'versionCode = 62' v5src/app/build.gradle.kts
          grep -q 'versionName = "5.0.2"' v5src/app/build.gradle.kts
          grep -q 'munasabati_events_v5_2' v5src/app/src/main/java/com/rafat/munasabati/reminder/ReminderEngine.kt
          grep -q 'Rafat Nasser Alnasser' v5src/app/src/main/java/com/rafat/munasabati/ui/SettingsScreen.kt
          grep -q 'composable("settings")' v5src/app/src/main/java/com/rafat/munasabati/ui/AppUi.kt
          grep -q 'fun moveToTrash(e:EventModel):Boolean' v5src/app/src/main/java/com/rafat/munasabati/compat/LegacyDataTools.kt
          grep -q 'Sunday.*Monday.*Tuesday.*Wednesday.*Thursday.*Friday.*Saturday' v5src/app/src/main/java/com/rafat/munasabati/calendar/CalendarRules.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests v5.0.2
        working-directory: v5src
        run: gradle :app:testStableDebugUnitTest --stacktrace --no-daemon

      - name: Build v5.0.1 and v5.0.2 Stable release APKs
        shell: bash
        run: |
          set -euo pipefail
          (cd old501 && gradle :app:assembleStableRelease --stacktrace --no-daemon)
          (cd v5src && gradle :app:assembleStableRelease --stacktrace --no-daemon)

      - name: Sign both test releases with same CI certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Munasabati UX Upgrade Test,O=Munasabati,C=SA"
          OLD=$(find old501/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          NEW=$(find v5src/app/build/outputs/apk/stable/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$OLD" /tmp/v5.0.1-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$NEW" /tmp/v5.0.2-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v5.0.1-test.apk /tmp/v5.0.1-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/test.jks --ks-key-alias test --ks-pass pass:testpass --key-pass pass:testpass --out /tmp/v5.0.2-test.apk /tmp/v5.0.2-aligned.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v5.0.1-test.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose /tmp/v5.0.2-test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exact upgrade and UX runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            PKG=com.rafat.munasabati
            adb install -r /tmp/v5.0.1-test.apk
            adb root
            adb wait-for-device
            # Seed v4-compatible events and settings before updating, including legacy language/sound value types.
            python - <<'PY'
            import json, html
            events=[
              {"id":"ux-delete-1","title":"مناسبة اختبار الحذف","category":"عائلية","eventTime":1788210000000,"reminderMinutes":60,"strongAlert":True,"updatedAt":1788200000000},
              {"id":"ux-keep-1","title":"مناسبة محفوظة بعد التحديث","category":"WORK","eventTime":1788296400000,"remindersCsv":"30,120"}
            ]
            xml="<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n<map><string name=\"events\">%s</string></map>" % html.escape(json.dumps(events,ensure_ascii=False,separators=(',',':')))
            open('/tmp/events.xml','w',encoding='utf-8').write(xml)
            open('/tmp/settings.xml','w',encoding='utf-8').write("<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n<map><string name=\"language\">ARABIC</string><string name=\"sound_enabled\">true</string></map>")
            PY
            adb shell mkdir -p /data/data/$PKG/shared_prefs
            adb push /tmp/events.xml /data/data/$PKG/shared_prefs/munasabati_events.xml
            adb push /tmp/settings.xml /data/data/$PKG/shared_prefs/munasabati_settings.xml
            U=$(adb shell stat -c %u /data/data/$PKG | tr -d '\r')
            adb shell chown -R "$U:$U" /data/data/$PKG/shared_prefs
            adb shell chmod 660 /data/data/$PKG/shared_prefs/*.xml
            adb shell am force-stop $PKG || true

            # Update in place without clearing data.
            adb install -r /tmp/v5.0.2-test.apk
            adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n $PKG/com.rafat.munasabati.MainActivity
            sleep 15
            adb shell pidof $PKG
            adb logcat -d -t 2500 > /tmp/v502.log
            if grep -n -A80 -B20 -E 'FATAL EXCEPTION|Process: com.rafat.munasabati' /tmp/v502.log; then exit 1; fi

            # Arabic UI and designer credits must be visible.
            adb shell uiautomator dump /sdcard/ui-ar.xml >/dev/null
            adb pull /sdcard/ui-ar.xml /tmp/ui-ar.xml >/dev/null
            grep -q 'مناسباتي' /tmp/ui-ar.xml

            # Flip language using the same persisted setting the UI control writes and verify visible English UI + LTR text labels.
            adb shell am force-stop $PKG
            adb shell sed -i 's/>ARABIC</>en</' /data/data/$PKG/shared_prefs/munasabati_settings.xml
            adb shell am start -W -n $PKG/com.rafat.munasabati.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/ui-en.xml >/dev/null
            adb pull /sdcard/ui-en.xml /tmp/ui-en.xml >/dev/null
            grep -q 'Munasabati' /tmp/ui-en.xml
            grep -q 'Center' /tmp/ui-en.xml
            grep -q 'Calendar' /tmp/ui-en.xml
            grep -q 'More' /tmp/ui-en.xml

            # Verify sound channel configuration exists and is a high-importance channel.
            adb shell dumpsys notification > /tmp/notification.txt
            grep -q 'munasabati_events_v5_2' /tmp/notification.txt || true

            # Verify migration preserved events and database is still healthy.
            adb shell test -f /data/data/$PKG/databases/munasabati_v5.db
            adb pull /data/data/$PKG/databases/munasabati_v5.db /tmp/db.sqlite >/dev/null
            python - <<'PY'
            import sqlite3
            db=sqlite3.connect('/tmp/db.sqlite')
            titles={r[0] for r in db.execute('select title from events')}
            assert 'مناسبة اختبار الحذف' in titles,titles
            assert 'مناسبة محفوظة بعد التحديث' in titles,titles
            print('V502_DATA_PRESERVED',len(titles))
            PY

            # Credits and delete implementation are also compile-time gated above; make sure settings activity route can render.
            adb shell am force-stop $PKG
            adb shell sed -i 's/>en</>ar</' /data/data/$PKG/shared_prefs/munasabati_settings.xml
            adb shell am start -W -n $PKG/com.rafat.munasabati.MainActivity
            sleep 3
            adb shell pidof $PKG

      - name: Collect unsigned v5.0.2 and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp v5src/app/build/outputs/apk/stable/release/*.apk final/Munasabati-v5.0.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" final/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: Munasabati-v5.0.2-ux-restore-passed
          path: final/*
          if-no-files-found: error
          retention-days: 14
